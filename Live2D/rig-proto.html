<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>大章鱼 · 参数化 rig 原型</title>
<style>
  html,body{margin:0;height:100%;background:#061c2f;overflow:hidden;font-family:"Microsoft YaHei",sans-serif}
  #stage{position:relative;width:1080px;height:1920px;transform-origin:0 0;overflow:hidden;
    background:radial-gradient(120% 80% at 50% 18%,#0b3a5e 0%,#061c2f 55%,#03101c 100%)}
  #rig{position:absolute;left:230px;bottom:420px;width:620px;height:850px}
  #dbg{position:absolute;left:28px;bottom:28px;color:#8fd0ff;font-size:20px;line-height:1.5;
    background:rgba(4,20,40,.5);padding:12px 16px;border-radius:14px;white-space:pre;
    border:1px solid rgba(120,200,255,.18)}
  #hint{position:absolute;left:50%;top:56px;transform:translateX(-50%);color:#9fd0f0;font-size:26px;
    background:rgba(4,20,40,.55);padding:10px 22px;border-radius:999px;border:1px solid rgba(120,200,255,.25)}
</style>
</head>
<body>
<div id="stage">
  <canvas id="rig" width="875" height="1200"></canvas>
  <div id="hint">参数化 rig 原型 · 呼吸 / 摇摆 / 眨眼 / 口型 / 触手</div>
  <div id="dbg">loading…</div>
</div>
<script>
const stage = document.getElementById('stage');
function fit(){ const s = Math.min(innerWidth/1080, innerHeight/1920);
  stage.style.transform = `translate(${(innerWidth-1080*s)/2}px,${(innerHeight-1920*s)/2}px) scale(${s})`; }
addEventListener('resize', fit); fit();

const cvs = document.getElementById('rig');
const ctx = cvs.getContext('2d');
const W = cvs.width, H = cvs.height;
const dbg = document.getElementById('dbg');

const RIG = { eyes:[348,222,552,292], mouth:[424,303,470,336] };
const SRC = {
  body:   './assets/octo/rig/body_t.png',
  tent:   './assets/octo/rig/tent_t.png',
  closed: './assets/octo/eyes_closed_t.png',
  open:   './assets/octo/mouth_open_t.png'
};
const img = {};
let loaded = 0;
for (const k in SRC) {
  const im = new Image();
  im.onload = () => { loaded++; if (loaded === Object.keys(SRC).length) ready(); };
  im.onerror = () => { loaded++; };
  im.src = SRC[k];
  img[k] = im;
}

const S = {
  t0: performance.now(), act: 'idle', actStart: 0, actUntil: 0,
  talkUntil: 0, blinkAt: 1.2, blinkT: -1,
  p: { angleX:0, angleZ:0, bodyX:0, breath:0, eye:1, mouth:0, tent:0 }
};

function ready(){ window.__rigReady = true; dbg.textContent = 'ready · 875x1200\nparam: angleX/angleZ/bodyX/breath/eye/mouth/tent'; }

function makePatch(src, box, pad) {
  const [x0,y0,x1,y1] = box;
  const w = x1-x0+pad*2, h = y1-y0+pad*2;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  c.getContext('2d').drawImage(src, x0-pad, y0-pad, w, h, 0, 0, w, h);
  return { c, x:x0-pad, y:y0-pad, w, h };
}
let eyePatch = null, mouthPatch = null;
function buildPatches(){
  if (img.closed.complete && img.closed.naturalWidth) eyePatch = makePatch(img.closed, RIG.eyes, 18);
  if (img.open.complete && img.open.naturalWidth) mouthPatch = makePatch(img.open, RIG.mouth, 14);
}

// 横向条带变形：dx(y) 返回该高度要偏移多少像素
function drawBands(image, dxFn) {
  const bands = 60, bh = H / bands;
  for (let i = 0; i < bands; i++) {
    const y = Math.floor(i * bh);
    const hh = Math.min(Math.ceil(bh) + 1, H - y);   // 多画 1px 消除接缝
    if (hh <= 0) break;
    const dx = dxFn(y + hh / 2);
    ctx.drawImage(image, 0, y, W, hh, dx, y, W, hh);
  }
}

function blinkAmount(t){
  if (t > S.blinkAt) { S.blinkT = 0; S.blinkAt = t + 2.3 + Math.random() * 3.4; }
  if (S.blinkT < 0) return 0;
  S.blinkT += 1/60;
  const d = 0.16;
  let v = S.blinkT < d/2 ? S.blinkT/(d/2) : Math.max(0, 1-(S.blinkT-d/2)/(d/2));
  if (S.blinkT > d) { S.blinkT = -1; v = 0; }
  return v;
}

function frame(){
  requestAnimationFrame(frame);
  const now = performance.now()/1000;
  const t = now - S.t0/1000;
  if (S.actUntil && now > S.actUntil) S.act = 'idle';
  const talking = now < S.talkUntil;
  const a = S.act;

  // ---- 参数计算 ----
  const breath = Math.sin(t*1.55);
  let angleX = Math.sin(t*0.62) * 6;          // 左右轻轻摆头
  let angleZ = Math.sin(t*0.47) * 1.6;
  let bodyX  = Math.sin(t*0.44) * 3;
  let tent   = Math.sin(t*0.9) * 5;
  let bounce = 0, tilt = 0, squash = 1, flash = 0, closed = 0;
  if (a === 'dance') {
    angleX = Math.sin(t*5.4) * 10; angleZ = Math.sin(t*5.4) * 4;
    bodyX = Math.sin(t*2.7) * 7; tent = Math.sin(t*7.2) * 14;
    bounce = Math.abs(Math.sin(t*3.6)) * 12; squash = 1 + Math.sin(t*7.2)*0.008;
  } else if (a === 'lieflat') {
    const k = Math.min(1,(now-S.actStart)/0.9);
    tilt = -9*k; bounce = -26*k; angleX = 2*k; closed = k;
  } else if (a === 'jobhunt') {
    angleX = Math.sin(t*11) * 12; angleZ = Math.sin(t*11)*2;
  } else if (a === 'transform') {
    flash = 0.35 + 0.35*Math.sin(t*7);
    squash = 1 + Math.sin(t*8)*0.02;
    angleZ = Math.sin(t*6)*3;
  } else if (a === 'watchtv') {
    angleZ = -5; angleX = -6;    // 看向右上角电视
  } else if (a === 'paint') {
    angleZ = 3; tilt = 2;
  }

  // 口型
  let mouth = 0;
  if (talking) {
    mouth = 0.35 + 0.65 * (0.5+0.5*Math.sin(t*12.6));
  }
  const eye = Math.max(closed, blinkAmount(t));

  // ---- 绘制 ----
  ctx.clearRect(0,0,W,H);
  ctx.save();
  // 整体：呼吸缩放 + 弹跳 + 倾斜
  const cx = W/2, cy = H;
  ctx.translate(cx, cy - bounce);
  ctx.rotate(tilt * Math.PI/180);
  ctx.scale(1, squash * (1 + breath*0.004));
  ctx.translate(-cx, -cy + breath*2);

  // 头部权重：越高越摆动
  const headW = (y) => Math.max(0, 1 - y/560);          // 0..1
  const headShift = (y) => (angleX + bodyX) * headW(y) * 1.15;
  const headRot = (y) => (angleX * 0.9) * headW(y);

  // 触手层（在身体后面一点，先画）
  const tentShift = (y) => {
    const k = Math.max(0, (y - 860) / 340);
    return tent * k + Math.sin(t*1.7 + y*0.01) * 2 * k;
  };
  if (img.tent.complete && img.tent.naturalWidth) drawBands(img.tent, tentShift);

  // 主体
  if (img.body.complete && img.body.naturalWidth) drawBands(img.body, headShift);

  // 眼睛（眨眼贴片）
  if (eyePatch && eye > 0.02) {
    const dx = headShift(RIG.eyes[1]);
    ctx.globalAlpha = Math.min(1, eye);
    ctx.drawImage(eyePatch.c, eyePatch.x + dx, eyePatch.y);
    ctx.globalAlpha = 1;
  }
  // 嘴（说话贴片，越张越大）
  if (mouthPatch && mouth > 0.05) {
    const dx = headShift(RIG.mouth[1]);
    const bx = RIG.mouth[0], by = RIG.mouth[1], bw = mouthPatch.w, bh = mouthPatch.h;
    const mh = bh * (0.55 + 0.55*mouth);
    ctx.drawImage(mouthPatch.c, 0, 0, bw, bh, bx + dx, by - (mh-bh)/2, bw, mh);
  }
  ctx.restore();

  if (flash > 0) {
    ctx.globalAlpha = flash * 0.25;
    ctx.fillStyle = '#fff2c8';
    ctx.fillRect(0,0,W,H);
    ctx.globalAlpha = 1;
  }

  S.p = {angleX, angleZ, bodyX, breath, eye, mouth, tent};
  dbg.textContent = `act=${a}  eye=${eye.toFixed(2)}  mouth=${mouth.toFixed(2)}\nangleX=${angleX.toFixed(1)} tent=${tent.toFixed(1)} bounce=${bounce.toFixed(1)}`;
}

// 贴图加载完后建补丁
const t0 = setInterval(() => {
  if (img.closed.complete && img.open.complete) { buildPatches(); clearInterval(t0); }
}, 300);

frame();

window.__rigPlay = function(name, secs){
  S.act = name || 'idle'; S.actStart = performance.now()/1000;
  S.actUntil = secs ? S.actStart + secs : 0;
  return S.act;
};
window.__rigTalk = function(text){
  const len = (text||'').length || 6;
  S.talkUntil = performance.now()/1000 + Math.min(30, 0.5 + len*0.13);
  return S.talkUntil;
};
window.__rigState = function(){
  return { ready: !!window.__rigReady, act: S.act, p: S.p };
};
</script>
</body>
</html>
