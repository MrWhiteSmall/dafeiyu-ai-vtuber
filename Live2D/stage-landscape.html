<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>大肥鱼 · 海底大厅 · 横屏</title>
<link rel="stylesheet" href="./css/live2d.css">
<script src="./js/model_name.js?v=20261027-mao"></script>
<script src="./js/live2dcubismcore.js?v=5.1.0"></script>
<script src="./js/bundle.songroom-lipsync.js?v=20261028-pose1"></script>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#081b35}
body{display:grid;place-items:center}
#stage{position:absolute;width:1920px;height:1080px;overflow:hidden;isolation:isolate;transform-origin:center center;background:#102e51 url('./assets/aquarium-landscape-20261028.png') center/cover no-repeat}
#model-surface{position:absolute;width:900px;height:1040px;left:510px;top:-5px;transform:scale(1);transform-origin:0 0;z-index:2}
#landlord{width:900px!important;height:1040px!important;margin:0;background:transparent}
#live2d{width:900px!important;height:1040px!important;display:block}
.message,#controller{display:none!important}

/* ── 能力展示面板 ── */
#ability{
  position:absolute;right:46px;top:50%;transform:translateY(-50%);
  width:470px;padding:26px 26px 22px;z-index:6;
  border-radius:28px;
  background:linear-gradient(160deg,rgba(6,30,56,.72),rgba(4,18,36,.82));
  border:1px solid rgba(120,200,255,.28);
  box-shadow:0 18px 48px rgba(0,12,28,.45),inset 0 1px 0 rgba(180,230,255,.18);
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;
  opacity:0;transition:opacity .8s ease;
}
#ability.show{opacity:1}
#ability .ah{display:flex;align-items:baseline;gap:12px;margin-bottom:18px}
#ability .ah b{font-size:34px;color:#eaf6ff;letter-spacing:1px;font-weight:800;text-shadow:0 2px 10px rgba(0,30,60,.5)}
#ability .ah span{font-size:20px;color:#8fc7ee;letter-spacing:.5px}
#ability .ai-badge{margin-left:auto;font-size:19px;color:#9fdcff;border:1px solid rgba(140,215,255,.45);border-radius:999px;padding:3px 12px;white-space:nowrap}
.ab-item{display:flex;align-items:center;gap:14px;padding:11px 14px;border-radius:16px;transition:background .35s,box-shadow .35s,transform .35s;margin-bottom:6px}
.ab-item .ico{font-size:32px;width:42px;text-align:center;filter:drop-shadow(0 2px 6px rgba(0,20,40,.5))}
.ab-item .txt{display:flex;flex-direction:column;line-height:1.25}
.ab-item .k{font-size:28px;color:#eaf6ff;font-weight:700}
.ab-item .v{font-size:22px;color:#a8d6f5;margin-top:2px}
.ab-item.on{background:linear-gradient(90deg,rgba(80,180,255,.24),rgba(80,180,255,.06));box-shadow:inset 0 0 0 1px rgba(130,215,255,.35),0 0 26px rgba(60,170,255,.18);transform:translateX(-6px)}
.ab-item.on .k{color:#ffffff}
#ability .af{margin-top:14px;padding-top:14px;border-top:1px dashed rgba(120,200,255,.22);font-size:20px;color:#88bfe4;text-align:center;letter-spacing:.5px}
</style></head><body>
<main id="stage" data-layout="clean-landscape" aria-label="海底大厅直播场景">
<div id="model-surface"><div id="landlord"><canvas id="live2d" class="live2d" width="1800" height="2080" aria-label="AI Live2D 角色"></canvas></div></div>
</main>
<script src="./js/jquery.min.js"></script>
<script src="./js/songroom-lipsync.js?v=20261028-lip1"></script>
<script>
// 舞台尺寸和 OBS 来源尺寸一致时为 1:1，不套另一层横竖画布。
const stage=document.getElementById('stage');
function fitStage(){stage.style.transform=`scale(${Math.min(innerWidth/1920,innerHeight/1080)})`;}
addEventListener('resize',fitStage);fitStage();
</script><script src="./js/stage-captions.js?v=caption1"></script>
<script src="./js/stage-overlay.js?v=overlay1"></script>
<script src="./js/stage-panel.js?v=panel1"></script>
</body></html>
