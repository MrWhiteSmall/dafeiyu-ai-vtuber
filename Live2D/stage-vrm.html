<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>大章鱼 · VRM 舞台（原型）</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#04121f;overflow:hidden;
    font-family:"Microsoft YaHei","PingFang SC",sans-serif;}
  #stage{position:relative;width:1080px;height:1920px;transform-origin:0 0;overflow:hidden;
    background:radial-gradient(120% 80% at 50% 18%,#0b3a5e 0%,#061c2f 55%,#03101c 100%);}
  #vrm{position:absolute;left:0;top:0;width:1080px;height:1920px;}
  #hint{position:absolute;left:50%;top:60px;transform:translateX(-50%);color:#9fd0f0;
    font-size:26px;letter-spacing:1px;background:rgba(4,20,40,.55);padding:10px 22px;
    border-radius:999px;border:1px solid rgba(120,200,255,.25)}
  #dbg{position:absolute;left:28px;bottom:28px;color:#8fd0ff;font-size:20px;line-height:1.5;
    background:rgba(4,20,40,.5);padding:12px 16px;border-radius:14px;white-space:pre;
    border:1px solid rgba(120,200,255,.18)}
</style>
</head>
<body>
<div id="stage">
  <canvas id="vrm" width="1080" height="1920"></canvas>
  <div id="hint">VRM 原型 · 待机 / 眨眼 / 说话口型</div>
  <div id="dbg">loading…</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './vendor/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from './vendor/three-vrm.module.js';

const MODEL_URL = new URLSearchParams(location.search).get('m') || './vendor/models/Seed-san.vrm';

const canvas = document.getElementById('vrm');
const dbg = document.getElementById('dbg');
const stage = document.getElementById('stage');

// 适配：整页按 CSS 缩放，内部永远按 1080x1920 画
function fitStage() {
  const s = Math.min(window.innerWidth / 1080, window.innerHeight / 1920);
  stage.style.transform = `translate(${(window.innerWidth - 1080 * s) / 2}px,${(window.innerHeight - 1920 * s) / 2}px) scale(${s})`;
}
window.addEventListener('resize', fitStage); fitStage();

const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, premultipliedAlpha: false });
renderer.setSize(1080, 1920, false);
renderer.setPixelRatio(1);
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1080 / 1920, 0.1, 30);
camera.position.set(0, 1.12, 3.05);
camera.lookAt(0, 1.02, 0);

scene.add(new THREE.HemisphereLight(0xcfe9ff, 0x2a4a66, 2.1));
const key = new THREE.DirectionalLight(0xfff3e0, 2.2); key.position.set(1.2, 2.4, 2.0); scene.add(key);
const rim = new THREE.DirectionalLight(0x8fd8ff, 1.4); rim.position.set(-1.6, 1.8, -1.4); scene.add(rim);

let vrm = null, clock = new THREE.Clock();
const S = {
  ready: false, model: '', talkUntil: 0, act: 'idle', actUntil: 0,
  blinkAt: 1.2, blinkT: -1, parts: {}
};

function log(s) { dbg.textContent = s; }

const loader = new GLTFLoader();
loader.register((parser) => new VRMLoaderPlugin(parser));

loader.load(MODEL_URL, (gltf) => {
  vrm = gltf.userData.vrm;
  if (!vrm) { log('不是 VRM 文件'); return; }
  try { VRMUtils.removeUnnecessaryVertices(gltf.scene); } catch (e) {}
  try { VRMUtils.combineSkeletons(gltf.scene); } catch (e) {}
  vrm.scene.traverse((o) => { o.frustumCulled = false; });
  // VRM 默认朝 +Z，正对镜头，不需要翻转
  scene.add(vrm.scene);

  // 记录骨骼
  const h = vrm.humanoid;
  ['hips', 'spine', 'chest', 'neck', 'head',
   'leftUpperArm', 'leftLowerArm', 'rightUpperArm', 'rightLowerArm',
   'leftHand', 'rightHand', 'leftUpperLeg', 'rightUpperLeg'].forEach((n) => {
    try { S.parts[n] = h.getNormalizedBoneNode(n); } catch (e) {}
  });

  // 表情能力探测
  const em = vrm.expressionManager;
  S.expr = em ? (em.expressions || []).map((e) => e.expressionName || e.name) : [];
  S.basePos = {};
  Object.keys(S.parts).forEach((n) => { if (S.parts[n]) S.basePos[n] = S.parts[n].position.clone(); });
  S.ready = true;
  window.__vrmReady = true;
  log(`ready · ${MODEL_URL.split('/').pop()}\nexpr: ${S.expr.slice(0, 12).join(', ')}`);
}, undefined, (err) => log('加载失败: ' + (err && err.message ? err.message : err)));

function setExpr(name, v) {
  if (!vrm || !vrm.expressionManager) return;
  try { vrm.expressionManager.setValue(name, Math.max(0, Math.min(1, v))); } catch (e) {}
}

// ---- 口型：aa/ih/ou/ee/oh 轮流开合 ----
function mouth(t, talking) {
  if (!talking) {
    ['aa', 'ih', 'ou', 'ee', 'oh'].forEach((n) => setExpr(n, 0));
    return;
  }
  const f = 0.5 + 0.5 * Math.sin(t * 13.0);
  const g = 0.5 + 0.5 * Math.sin(t * 8.3 + 1.7);
  setExpr('aa', 0.10 + 0.62 * f);
  setExpr('ih', 0.05 + 0.20 * g);
  setExpr('ou', 0.22 * (1 - f));
  setExpr('ee', 0.10 * g);
  setExpr('oh', 0.12 * (1 - g));
}

// ---- 眨眼 ----
function blink(dt, t) {
  if (t > S.blinkAt) { S.blinkT = 0; S.blinkAt = t + 2.4 + Math.random() * 3.4; }
  let v = 0;
  if (S.blinkT >= 0) {
    S.blinkT += dt;
    const d = 0.17;
    v = S.blinkT < d / 2 ? S.blinkT / (d / 2) : Math.max(0, 1 - (S.blinkT - d / 2) / (d / 2));
    if (S.blinkT > d) { S.blinkT = -1; v = 0; }
  }
  setExpr('blink', v);
  setExpr('blinkLeft', v);
  setExpr('blinkRight', v);
}

// ---- 程序化动作 ----
const BONE_ALL = ['hips','spine','chest','neck','head','leftUpperArm','rightUpperArm',
  'leftLowerArm','rightLowerArm','leftHand','rightHand','leftUpperLeg','rightUpperLeg'];
const BASE_AL = -1.44, BASE_AR = 1.44;   // 把 T-pose 的手臂放下来（≈垂直）

function act(t, dt) {
  const P = S.parts;
  const now = performance.now() / 1000;
  if (S.actUntil && now > S.actUntil) S.act = 'idle';
  const a = S.act;
  S.actNow = a;

  BONE_ALL.forEach((n) => {
    if (!P[n]) return;
    P[n].rotation.set(0, 0, 0);
    const bp = S.basePos && S.basePos[n];
    if (bp) P[n].position.copy(bp);
  });
  if (!vrm) return;
  vrm.scene.position.set(0, 0, 0);
  vrm.scene.rotation.set(0, 0, 0);

  // 基础站姿 + 呼吸
  const br = Math.sin(t * 1.7);
  if (P.chest) P.chest.rotation.x = -0.02 + br * 0.022;
  if (P.spine) P.spine.rotation.x = 0.014 + br * 0.012;
  if (P.neck) P.neck.rotation.x = -0.03 + br * 0.008;
  if (P.head) { P.head.rotation.y = Math.sin(t * 0.63) * 0.07; P.head.rotation.x = Math.sin(t * 0.91) * 0.028; }
  if (P.leftUpperArm) { P.leftUpperArm.rotation.z = BASE_AL; P.leftUpperArm.rotation.x = -0.05; }
  if (P.rightUpperArm) { P.rightUpperArm.rotation.z = BASE_AR; P.rightUpperArm.rotation.x = -0.05; }
  if (P.leftLowerArm) P.leftLowerArm.rotation.y = -0.28 + Math.sin(t * 1.13) * 0.03;
  if (P.rightLowerArm) P.rightLowerArm.rotation.y = 0.28 - Math.sin(t * 1.13 + 0.5) * 0.03;
  if (P.hips) P.hips.rotation.z = Math.sin(t * 0.55) * 0.012;

  const k = Math.min(1, (now - (S.actStart || now)) / 0.7);   // 动作淡入 0..1

  if (a === 'dance') {
    const b = Math.sin(t * 6.4), b2 = Math.sin(t * 3.2);
    if (P.hips) P.hips.rotation.z = b * 0.11;
    vrm.scene.position.y = Math.abs(b) * 0.035;
    if (P.leftUpperArm) { P.leftUpperArm.rotation.z = 0.55 + b * 0.45; P.leftUpperArm.rotation.x = -0.35; }
    if (P.rightUpperArm) { P.rightUpperArm.rotation.z = -0.55 - b * 0.45; P.rightUpperArm.rotation.x = -0.35; }
    if (P.leftLowerArm) P.leftLowerArm.rotation.y = -0.75 - b * 0.25;
    if (P.rightLowerArm) P.rightLowerArm.rotation.y = 0.75 + b * 0.25;
    if (P.head) { P.head.rotation.z = b * 0.12; P.head.rotation.x = -0.06 + b2 * 0.05; }
    if (P.leftUpperLeg) P.leftUpperLeg.rotation.x = b2 * 0.16;
    if (P.rightUpperLeg) P.rightUpperLeg.rotation.x = -b2 * 0.16;
    setExpr('happy', 0.55);
  } else if (a === 'transform') {
    const sp = Math.min(1.0, (now - (S.actStart || now)) / 1.0);
    vrm.scene.rotation.y = sp * Math.PI * 2;
    if (P.leftUpperArm) { P.leftUpperArm.rotation.z = BASE_AL * (1 - sp) + (-1.9) * sp; }
    if (P.rightUpperArm) { P.rightUpperArm.rotation.z = BASE_AR * (1 - sp) + (1.9) * sp; }
    setExpr('happy', 0.35 + 0.5 * sp);
  } else if (a === 'lieflat') {
    vrm.scene.position.y = -0.22 * k;
    if (P.hips) P.hips.rotation.x = -0.18 * k;
    if (P.spine) P.spine.rotation.x = 0.12 * k;
    if (P.chest) P.chest.rotation.x = 0.14 * k;
    if (P.head) { P.head.rotation.x = 0.42 * k; P.head.rotation.z = -0.12 * k; }
    if (P.leftUpperArm) P.leftUpperArm.rotation.z = BASE_AL + 0.12 * k;
    if (P.rightUpperArm) P.rightUpperArm.rotation.z = BASE_AR - 0.12 * k;
    if (P.leftLowerArm) P.leftLowerArm.rotation.y = -0.12 * k;
    if (P.rightLowerArm) P.rightLowerArm.rotation.y = 0.12 * k;
    setExpr('blink', Math.min(1, k * 1.4));
    setExpr('relaxed', 0.5 * k);
  } else if (a === 'jobhunt') {
    const sh = Math.sin(t * 9.5);
    if (P.head) { P.head.rotation.y = sh * 0.2; P.head.rotation.x = 0.1; }
    if (P.leftUpperArm) { P.leftUpperArm.rotation.z = BASE_AL + 0.35; P.leftUpperArm.rotation.x = -0.75; }
    if (P.rightUpperArm) { P.rightUpperArm.rotation.z = BASE_AR - 0.35; P.rightUpperArm.rotation.x = -0.75; }
    if (P.leftLowerArm) P.leftLowerArm.rotation.y = -1.25;
    if (P.rightLowerArm) P.rightLowerArm.rotation.y = 1.25;
    setExpr('sad', 0.45);
  } else if (a === 'paint') {
    if (P.rightUpperArm) { P.rightUpperArm.rotation.z = BASE_AR - 0.1; P.rightUpperArm.rotation.x = -0.95; }
    if (P.rightLowerArm) P.rightLowerArm.rotation.y = 0.85;
    if (P.leftUpperArm) { P.leftUpperArm.rotation.z = BASE_AL + 0.1; P.leftUpperArm.rotation.x = -0.35; }
    if (P.head) { P.head.rotation.x = 0.2; P.head.rotation.y = -0.1; }
  } else if (a === 'show') {
    const lift = Math.sin(t * 1.8) * 0.03;
    if (P.leftUpperArm) { P.leftUpperArm.rotation.z = BASE_AL + 0.55; P.leftUpperArm.rotation.x = -0.9 + lift; }
    if (P.rightUpperArm) { P.rightUpperArm.rotation.z = BASE_AR - 0.55; P.rightUpperArm.rotation.x = -0.9 - lift; }
    if (P.leftLowerArm) P.leftLowerArm.rotation.y = -1.35;
    if (P.rightLowerArm) P.rightLowerArm.rotation.y = 1.35;
    if (P.head) P.head.rotation.x = -0.05;
    setExpr('happy', 0.6);
  } else if (a === 'watchtv') {
    if (P.head) { P.head.rotation.y = -0.34; P.head.rotation.x = -0.12; }
    if (P.neck) P.neck.rotation.y = -0.12;
    setExpr('relaxed', 0.4);
  } else if (a === 'wave') {
    const w = Math.sin(t * 9.5);
    if (P.rightUpperArm) { P.rightUpperArm.rotation.z = 1.55; P.rightUpperArm.rotation.x = -0.25; }
    if (P.rightLowerArm) P.rightLowerArm.rotation.y = 0.55 + w * 0.4;
    if (P.head) P.head.rotation.z = w * 0.05;
    setExpr('happy', 0.5);
  }
}

function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(0.05, clock.getDelta());
  const t = clock.elapsedTime;
  if (vrm) {
    const talking = performance.now() / 1000 < S.talkUntil;
    act(t, dt);
    mouth(t, talking);
    blink(dt, t);
    if (vrm.expressionManager) vrm.expressionManager.update();
    vrm.humanoid.update();
    vrm.update(dt);
  }
  renderer.render(scene, camera);
}
tick();

// ---- 对外接口（给页面/自测用）----
window.__vrmPlay = function (name, secs) {
  S.act = name || 'idle';
  S.actStart = performance.now() / 1000;
  S.actUntil = secs ? S.actStart + secs : 0;
  return S.act;
};
window.__vrmTalk = function (text) {
  const len = (text || '').length || 6;
  S.talkUntil = performance.now() / 1000 + Math.min(30, 0.55 + len * 0.135);
  return S.talkUntil;
};
window.__vrmState = function () {
  return { ready: S.ready, model: MODEL_URL, act: S.act, talking: performance.now() / 1000 < S.talkUntil, expr: (S.expr || []).length };
};
window.__vrmModel = function (url) { location.search = '?m=' + encodeURIComponent(url); };
</script>
</body>
</html>
