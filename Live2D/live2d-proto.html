<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>大肥鱼 · Live2D 原型</title>
<style>
  html,body{margin:0;height:100%;background:#061c2f;overflow:hidden;font-family:"Microsoft YaHei",sans-serif}
  #stage{position:relative;width:1080px;height:1920px;transform-origin:0 0;overflow:hidden;
    background:radial-gradient(120% 80% at 50% 18%,#0b3a5e 0%,#061c2f 55%,#03101c 100%)}
  #lv{position:absolute;left:60px;bottom:120px;width:960px;height:1500px}
  #dbg{position:absolute;left:28px;bottom:28px;color:#8fd0ff;font-size:20px;line-height:1.5;
    background:rgba(4,20,40,.5);padding:12px 16px;border-radius:14px;white-space:pre;
    border:1px solid rgba(120,200,255,.18)}
  #hint{position:absolute;left:50%;top:56px;transform:translateX(-50%);color:#9fd0f0;font-size:26px;
    background:rgba(4,20,40,.55);padding:10px 22px;border-radius:999px;border:1px solid rgba(120,200,255,.25)}
</style>
</head>
<body>
<div id="stage">
  <canvas id="lv"></canvas>
  <div id="hint">Live2D 原型 · 大肥鱼（真模型）</div>
  <div id="dbg">loading…</div>
</div>

<script src="./vendor/pixi.min.js"></script>
<script src="./vendor/live2d-display.min.js"></script>
<script src="./js/live2dcubismcore.js"></script>
<script src="./vendor/live2d-display-cubism4.min.js"></script>
<script>
const dbg = document.getElementById('dbg');
const log = (s) => { dbg.textContent = s; };
const stage = document.getElementById('stage');
function fit() {
  const s = Math.min(window.innerWidth / 1080, window.innerHeight / 1920);
  stage.style.transform = `translate(${(window.innerWidth - 1080 * s) / 2}px,${(window.innerHeight - 1920 * s) / 2}px) scale(${s})`;
}
addEventListener('resize', fit); fit();

const MODEL = './live2d-model/大肥鱼/大肥鱼.model3.json';
const S = { ready: false, talkUntil: 0, blinkAt: 1.2, blinkT: -1, act: 'idle', actUntil: 0 };

const app = new PIXI.Application({
  view: document.getElementById('lv'),
  width: 960, height: 1500,
  backgroundAlpha: 0,
  antialias: true,
  autoDensity: false,
  resolution: 1,
  autoStart: true
});

PIXI.live2d.Live2DModel.from(MODEL, { autoInteract: false }).then((model) => {
  app.stage.addChild(model);
  // 等比铺满高度
  const k = 1500 / model.internalModel.originalHeight;
  model.scale.set(k * 1.15);
  model.anchor.set(0.5, 0.5);
  model.position.set(960 / 2, 1500 / 2 + 30);
  model.autoUpdate = true;

  const cm = model.internalModel.coreModel;
  S.core = cm;
  S.groups = Object.keys(model.internalModel.settings.motions || {});
  S.model = model;
  S.ready = true;
  window.__l2dReady = true;
  window.__l2dModel = model;
  playIdle();
  log('ready · 大肥鱼\nmotions: ' + S.groups.join(', '));
}).catch((e) => log('失败: ' + (e && e.message ? e.message : e)));

function param(id, v) {
  try { S.core.setParameterValueById(id, v); } catch (e) {}
}

function playIdle() {
  try { S.model.motion('idle'); } catch (e) {}
}
function playGroup(g) {
  if (!S.model) return false;
  try { S.model.motion(g); return true; } catch (e) { return false; }
}

// ---- 主循环：眨眼 / 口型 / 呼吸 / 视线 ----
let t0 = performance.now();
function loop() {
  requestAnimationFrame(loop);
  if (!S.ready) return;
  const t = (performance.now() - t0) / 1000;
  const talking = performance.now() / 1000 < S.talkUntil;

  // 口型
  if (talking) {
    const f = 0.55 + 0.45 * Math.sin(t * 12.5);
    const g = 0.5 + 0.5 * Math.sin(t * 7.7 + 1.3);
    param('ParamMouthOpenY', 0.12 + 0.78 * f);
    param('ParamMouthForm', -0.15 + 0.3 * g);
  } else {
    param('ParamMouthOpenY', 0.04);
    param('ParamMouthForm', 0.12);
  }

  // 眨眼
  if (t > S.blinkAt) { S.blinkT = 0; S.blinkAt = t + 2.2 + Math.random() * 3.6; }
  let eye = 1;
  if (S.blinkT >= 0) {
    S.blinkT += 1 / 60;
    const d = 0.16;
    eye = S.blinkT < d / 2 ? 1 - S.blinkT / (d / 2) : (S.blinkT - d / 2) / (d / 2);
    if (S.blinkT > d) { S.blinkT = -1; eye = 1; }
  }
  param('ParamEyeLOpen', eye);
  param('ParamEyeROpen', eye);

  // 呼吸 / 轻微摆动（idle 动作也在跑，这里只叠加很小的量）
  param('ParamBreath', 0.5 + 0.5 * Math.sin(t * 1.5));
  param('ParamAngleZ', Math.sin(t * 0.6) * 3);
  param('ParamBodyAngleZ', Math.sin(t * 0.5) * 1.5);
  if (talking) param('ParamAngleX', Math.sin(t * 2.1) * 4);

  if (S.actUntil && performance.now() / 1000 > S.actUntil) S.act = 'idle';
}
loop();

// ---- 对外接口 ----
window.__l2dMotion = function (g) { return playGroup(g); };
window.__l2dGroups = function () { return S.groups || []; };
window.__l2dTalk = function (text) {
  const len = (text || '').length || 6;
  S.talkUntil = performance.now() / 1000 + Math.min(30, 0.5 + len * 0.13);
  return S.talkUntil;
};
window.__l2dParam = function (id, v) { param(id, v); };
window.__l2dExpr = function (name) {
  if (!S.ready) return null;
  try {
    const em = S.model.internalModel.motionManager.expressionManager;
    if (!em) return null;
    const list = em.definitions || [];
    const idx = list.findIndex((d) => (d.Name || d.name) === name);
    if (idx < 0) return list.map((d) => d.Name || d.name);
    em.setExpression(idx);
    return idx;
  } catch (e) { return null; }
};
window.__l2dState = function () {
  return { ready: S.ready, act: S.act, talking: performance.now() / 1000 < S.talkUntil, groups: S.groups || [] };
};
</script>
</body>
</html>
